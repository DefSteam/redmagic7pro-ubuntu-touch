[mountpoints]
mount = /dev/mmcblk0p1

#you can add more filesystems to the mount option, by making it a comma-seperated list.

[sync]
nofua = 1

[altmount]
mount = /home/user/MyDocs

[cdrom]
path =
timeout =

[udev]
# Direct usb_moded to device's actual USB power supply sysfs path instead of guessing
path = /sys/class/power_supply/usb
